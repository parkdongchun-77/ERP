<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ERP System</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { color-scheme: light; }
  body { font-family: -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", "Segoe UI", sans-serif; }
  input, select, textarea { color: #111 !important; background: #fff; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  .fade { animation: f .18s ease; } @keyframes f { from { opacity:0; transform: translateY(4px);} to {opacity:1;transform:none} }
</style>
</head>
<body class="bg-gray-50 text-gray-900">

<!-- 로그인 -->
<div id="loginView" class="hidden min-h-screen items-center justify-center p-4">
  <div class="w-full max-w-sm rounded-2xl border bg-white p-8 shadow-sm">
    <h1 class="mb-1 text-center text-2xl font-extrabold text-gray-900">ERP System</h1>
    <p class="mb-6 text-center text-xs text-gray-500">통합 관리 시스템</p>
    <p id="loginMsg" class="mb-4 hidden rounded bg-red-50 p-2 text-sm text-red-600"></p>
    <label class="mb-1 block text-sm font-semibold text-gray-900">이메일</label>
    <input id="email" type="email" autocomplete="username" class="mb-4 w-full rounded border border-gray-400 px-3 py-2 text-sm">
    <label class="mb-1 block text-sm font-semibold text-gray-900">비밀번호</label>
    <input id="password" type="password" autocomplete="current-password" class="mb-5 w-full rounded border border-gray-400 px-3 py-2 text-sm">
    <button onclick="doLogin()" class="mb-2 w-full rounded bg-indigo-600 py-2.5 text-sm font-semibold text-white hover:bg-indigo-700">로그인</button>
    <button onclick="doSignup()" class="w-full rounded border border-gray-400 py-2.5 text-sm font-semibold text-gray-900 hover:bg-gray-100">회원가입</button>
  </div>
</div>

<!-- 회사 생성 -->
<div id="onboardView" class="hidden min-h-screen items-center justify-center p-4">
  <div class="w-full max-w-sm rounded-2xl border bg-white p-8 shadow-sm">
    <h1 class="mb-2 text-xl font-bold">회사 만들기</h1>
    <p class="mb-6 text-sm text-gray-500">등록한 사람이 소유자(owner)가 됩니다.</p>
    <input id="companyName" placeholder="회사명" class="mb-4 w-full rounded border border-gray-400 px-3 py-2 text-sm">
    <button onclick="createCompany()" class="w-full rounded bg-indigo-600 py-2.5 text-sm font-semibold text-white hover:bg-indigo-700">회사 생성</button>
    <button onclick="doLogout()" class="mt-2 w-full py-2 text-xs text-gray-500 hover:underline">로그아웃</button>
  </div>
</div>

<!-- 앱 -->
<div id="appView" class="hidden min-h-screen">
  <div class="sticky top-0 z-30 flex items-center justify-between border-b bg-white px-4 py-3 lg:hidden">
    <button onclick="toggleNav()" class="rounded px-2 py-1 hover:bg-gray-100">☰</button>
    <span id="mCompany" class="truncate text-sm font-bold"></span>
    <button onclick="doLogout()" class="text-xs text-gray-500">로그아웃</button>
  </div>

  <div class="flex">
    <aside id="nav" class="fixed inset-y-0 left-0 z-40 hidden w-56 shrink-0 flex-col border-r bg-white lg:sticky lg:top-0 lg:flex lg:h-screen">
      <a href="#/" onclick="closeNav()" class="block border-b p-4 hover:bg-gray-50">
        <p id="companyLabel" class="truncate text-sm font-bold"></p>
        <p id="userLabel" class="mt-0.5 truncate text-xs text-gray-400"></p>
      </a>
      <nav id="menu" class="flex-1 overflow-y-auto p-2 text-sm"></nav>
      <div class="border-t p-2">
        <button onclick="doLogout()" class="w-full rounded px-3 py-2 text-left text-sm text-gray-500 hover:bg-gray-100">로그아웃</button>
      </div>
    </aside>
    <div id="navBackdrop" onclick="closeNav()" class="fixed inset-0 z-30 hidden bg-black/30 lg:hidden"></div>
    <main id="main" class="min-w-0 flex-1 p-4 lg:p-6"></main>
  </div>
</div>

<div id="toast" class="fixed bottom-5 left-1/2 z-50 hidden -translate-x-1/2 rounded-lg px-4 py-2.5 text-sm text-white shadow-lg"></div>

<script>
/* ===== 설정 ===== */
const SUPABASE_URL = "https://erp.141-164-46-88.sslip.io";
const ANON_KEY = "eyJhbGciOiAiSFMyNTYiLCAidHlwIjogIkpXVCJ9.eyJyb2xlIjogImFub24iLCAiaXNzIjogInN1cGFiYXNlIiwgImlhdCI6IDE3ODc0NTU0NDgsICJleHAiOiAyMTAyODE1NDQ4fQ.ZjBsOo3e4-vryCKqhX2DeBIkq9mEzmEmkMbKiYgy6lc";
const sb = window.supabase.createClient(SUPABASE_URL, ANON_KEY);

const MENU = [
  { key: "", label: "대시보드" },
  { key: "items", label: "품목" },
  { key: "partners", label: "거래처" },
  { key: "stock", label: "현재고" },
  { key: "ledger", label: "재고수불부" },
  { key: "sales", label: "판매" },
  { key: "receipts", label: "수금·미수금" },
];

let state = { user: null, companyId: null, companyName: "", role: "" };

/* ===== 유틸 ===== */
const $ = (id) => document.getElementById(id);
const won = (n) => (Number(n) || 0).toLocaleString();
const short = (n) => { n = Number(n) || 0; if (Math.abs(n) >= 1e8) return (n/1e8).toFixed(1)+"억"; if (Math.abs(n) >= 1e4) return Math.round(n/1e4).toLocaleString()+"만"; return n.toLocaleString(); };
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const today = () => new Date().toISOString().slice(0, 10);
const monthKey = (off) => { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - off); return d.toISOString().slice(0, 7); };

function toast(msg, err) {
  const t = $("toast"); t.textContent = msg;
  t.className = "fixed bottom-5 left-1/2 z-50 -translate-x-1/2 rounded-lg px-4 py-2.5 text-sm text-white shadow-lg " + (err ? "bg-red-600" : "bg-gray-900");
  clearTimeout(window._tt); window._tt = setTimeout(() => t.classList.add("hidden"), 2800);
}
function show(v) {
  ["loginView", "onboardView", "appView"].forEach(x => { const e = $(x); e.classList.add("hidden"); e.classList.remove("flex"); });
  const e = $(v); e.classList.remove("hidden"); if (v !== "appView") e.classList.add("flex");
}
function toggleNav() { $("nav").classList.toggle("hidden"); $("nav").classList.toggle("flex"); $("navBackdrop").classList.toggle("hidden"); }
function closeNav() { if (window.innerWidth < 1024) { $("nav").classList.add("hidden"); $("nav").classList.remove("flex"); $("navBackdrop").classList.add("hidden"); } }

/* ===== 인증 ===== */
async function doLogin() {
  const { error } = await sb.auth.signInWithPassword({ email: $("email").value.trim(), password: $("password").value });
  if (error) { $("loginMsg").textContent = error.message; $("loginMsg").classList.remove("hidden"); return; }
  await boot();
}
async function doSignup() {
  const { data, error } = await sb.auth.signUp({ email: $("email").value.trim(), password: $("password").value });
  if (error) { $("loginMsg").textContent = error.message; $("loginMsg").classList.remove("hidden"); return; }
  if (data.session) await boot(); else toast("확인 메일을 보냈습니다. 메일함을 확인하세요.");
}
async function doLogout() { await sb.auth.signOut(); location.hash = ""; show("loginView"); }
async function createCompany() {
  const name = $("companyName").value.trim();
  if (!name) return toast("회사명을 입력하세요", true);
  const { error } = await sb.rpc("create_company", { p_name: name });
  if (error) return toast(error.message, true);
  await boot();
}

async function boot() {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) return show("loginView");
  state.user = user;
  const { data: m } = await sb.from("memberships").select("company_id, role, companies(name)").limit(1).maybeSingle();
  if (!m) return show("onboardView");
  state.companyId = m.company_id; state.role = m.role; state.companyName = m.companies?.name ?? "회사";
  $("companyLabel").textContent = state.companyName;
  $("mCompany").textContent = state.companyName;
  $("userLabel").textContent = user.email;
  $("menu").innerHTML = MENU.map(x => `<a href="#/${x.key}" onclick="closeNav()" data-k="${x.key}" class="mi block rounded px-3 py-2 text-gray-700 hover:bg-gray-100">${x.label}</a>`).join("");
  show("appView");
  route();
}

/* ===== 라우팅 ===== */
const VIEWS = { "": vDashboard, items: vItems, partners: vPartners, stock: vStock, ledger: vLedger, sales: vSales, receipts: vReceipts };
window.addEventListener("hashchange", route);
function route() {
  if (!state.companyId) return;
  const key = location.hash.replace(/^#\/?/, "").split("?")[0];
  document.querySelectorAll(".mi").forEach(a => a.className = "mi block rounded px-3 py-2 hover:bg-gray-100 " + (a.dataset.k === key ? "bg-indigo-50 font-semibold text-indigo-700" : "text-gray-700"));
  $("main").innerHTML = `<div class="py-16 text-center text-sm text-gray-400">불러오는 중…</div>`;
  (VIEWS[key] || vDashboard)().catch(e => { $("main").innerHTML = `<div class="rounded bg-red-50 p-4 text-sm text-red-600">${esc(e.message || e)}</div>`; });
}
function h(html) { $("main").innerHTML = `<div class="fade">${html}</div>`; }
const card = (t, b) => `<section class="rounded-2xl border bg-white p-5 shadow-sm"><h2 class="mb-3 text-sm font-bold text-gray-800">${t}</h2>${b}</section>`;
const empty = (m) => `<p class="py-8 text-center text-sm text-gray-400">${m}</p>`;
function tbl(headers, rows, rightCols = []) {
  const R = new Set(rightCols);
  return `<div class="-mx-2 overflow-x-auto px-2"><table class="w-full border-collapse text-sm">
    <thead><tr class="border-b bg-gray-50 text-left">${headers.map((x, i) => `<th class="whitespace-nowrap p-2 font-semibold ${R.has(i) ? "text-right" : ""}">${x}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(r => `<tr class="border-b hover:bg-gray-50">${r.map((c, i) => `<td class="whitespace-nowrap p-2 ${R.has(i) ? "text-right" : ""}">${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}

/* ===== 대시보드 ===== */
async function vDashboard() {
  const from6 = monthKey(5) + "-01", cur = monthKey(0);
  const [sRes, pRes, rvRes, itRes, stRes, jrRes, topRes] = await Promise.all([
    sb.from("sales").select("doc_date, sales_lines(supply_amount, vat_amount)").eq("status", "confirmed").gte("doc_date", from6),
    sb.from("purchases").select("doc_date, purchase_lines(supply_amount, vat_amount)").eq("status", "confirmed").gte("doc_date", from6),
    sb.from("partner_receivables").select("partner_name, balance").gt("balance", 0).order("balance", { ascending: false }).limit(5),
    sb.from("items").select("id, safety_stock").gt("safety_stock", 0).eq("is_active", true),
    sb.from("current_stock").select("item_id, qty"),
    sb.from("journal_entries").select("id, entry_no, entry_date, description, journal_lines(debit)").order("created_at", { ascending: false }).limit(5),
    sb.from("sales").select("doc_date, sales_lines(supply_amount, vat_amount, items(name))").eq("status", "confirmed").gte("doc_date", cur + "-01"),
  ]);
  const docTotal = (rows, key, month) => (rows || []).filter(r => !month || r.doc_date.startsWith(month))
    .reduce((s, r) => s + (r[key] || []).reduce((a, l) => a + Number(l.supply_amount) + Number(l.vat_amount), 0), 0);

  const months = [5, 4, 3, 2, 1, 0].map(o => { const k = monthKey(o);
    return { label: Number(k.slice(5)) + "월", sales: docTotal(sRes.data, "sales_lines", k), purchases: docTotal(pRes.data, "purchase_lines", k) }; });
  const maxM = Math.max(1, ...months.map(m => Math.max(m.sales, m.purchases)));
  const cm = months[5], lm = months[4];
  const dS = lm.sales > 0 ? Math.round((cm.sales - lm.sales) / lm.sales * 100) : null;
  const dP = lm.purchases > 0 ? Math.round((cm.purchases - lm.purchases) / lm.purchases * 100) : null;

  const tot = new Map(); (stRes.data || []).forEach(s => tot.set(s.item_id, (tot.get(s.item_id) || 0) + Number(s.qty)));
  const shortage = (itRes.data || []).filter(i => (tot.get(i.id) || 0) < Number(i.safety_stock)).length;
  const rv = (rvRes.data || []).map(r => ({ name: r.partner_name, balance: Number(r.balance) }));
  const rvTotal = rv.reduce((s, r) => s + r.balance, 0), rvMax = Math.max(1, ...rv.map(r => r.balance));

  const byItem = new Map();
  (topRes.data || []).forEach(d => (d.sales_lines || []).forEach(l => {
    const n = l.items?.name || "기타";
    byItem.set(n, (byItem.get(n) || 0) + Number(l.supply_amount) + Number(l.vat_amount));
  }));
  const top = [...byItem.entries()].sort((a, b) => b[1] - a[1]).slice(0, 5);
  const topMax = Math.max(1, ...top.map(t => t[1])), topSum = top.reduce((s, t) => s + t[1], 0);
  const PAL = ["#4f46e5", "#e11d48", "#0d9488", "#f59e0b", "#64748b"];

  const badge = (d) => d === null ? "" : `<span class="ml-1.5 rounded px-1.5 py-0.5 text-[10px] font-bold ${d >= 0 ? "bg-green-100 text-green-700" : "bg-red-100 text-red-600"}">${d >= 0 ? "▲" : "▼"}${Math.abs(d)}%</span>`;
  const kpi = [
    ["이번달 매출", short(cm.sales) + "원", "from-indigo-500 to-blue-500", "#/sales", badge(dS)],
    ["이번달 매입", short(cm.purchases) + "원", "from-rose-500 to-pink-500", "#/", badge(dP)],
    ["미수금 잔액", short(rvTotal) + "원", "from-teal-500 to-emerald-500", "#/receipts", ""],
    ["재고 부족 품목", shortage + "건", "from-amber-500 to-orange-500", "#/stock", ""],
  ];

  // 도넛
  let acc = 0, donut = "";
  top.forEach(([n, v], i) => {
    const frac = topSum ? v / topSum : 0, r = 15.915, c = 2 * Math.PI * r;
    donut += `<circle cx="21" cy="21" r="${r}" fill="none" stroke="${PAL[i]}" stroke-width="7"
      stroke-dasharray="${(frac * c).toFixed(2)} ${c.toFixed(2)}" stroke-dashoffset="${(-acc * c).toFixed(2)}" transform="rotate(-90 21 21)"></circle>`;
    acc += frac;
  });

  h(`
  <div class="grid grid-cols-2 gap-3 xl:grid-cols-4">
    ${kpi.map(([l, v, g, href, b]) => `<a href="${href}" class="relative overflow-hidden rounded-2xl border bg-white p-4 shadow-sm transition hover:shadow-md">
      <div class="absolute inset-x-0 top-0 h-1 bg-gradient-to-r ${g}"></div>
      <p class="text-xs text-gray-500">${l}</p><p class="mt-1.5 text-xl font-extrabold">${v}${b}</p></a>`).join("")}
  </div>

  <div class="mt-5 grid grid-cols-1 gap-5 lg:grid-cols-3">
    <div class="lg:col-span-2">${card("최근 6개월 매출·매입 추이", `
      <div class="mb-2 flex gap-4 text-xs text-gray-500">
        <span><i class="mr-1 inline-block h-2 w-2 rounded-full bg-indigo-500"></i>매출</span>
        <span><i class="mr-1 inline-block h-2 w-2 rounded-full bg-rose-500"></i>매입</span></div>
      <div class="flex h-48 items-end gap-3">${months.map(m => `
        <div class="flex flex-1 flex-col items-center gap-1">
          <div class="flex h-40 w-full items-end justify-center gap-1">
            <div class="w-1/3 rounded-t bg-gradient-to-t from-indigo-600 to-indigo-400" style="height:${m.sales / maxM * 100}%" title="매출 ${won(m.sales)}"></div>
            <div class="w-1/3 rounded-t bg-gradient-to-t from-rose-500 to-rose-400" style="height:${m.purchases / maxM * 100}%" title="매입 ${won(m.purchases)}"></div>
          </div><span class="text-[11px] text-gray-500">${m.label}</span></div>`).join("")}</div>`)}</div>

    ${card("이번달 매출 구성", top.length ? `
      <div class="flex items-center gap-4">
        <svg viewBox="0 0 42 42" class="h-28 w-28 shrink-0">${donut}
          <text x="21" y="20.5" text-anchor="middle" font-size="4" fill="#111" font-weight="700">${short(topSum)}</text>
          <text x="21" y="25" text-anchor="middle" font-size="2.6" fill="#9ca3af">이번달</text></svg>
        <ul class="min-w-0 flex-1 space-y-1.5 text-xs">${top.map(([n, v], i) => `
          <li class="flex items-center gap-2"><i class="h-2 w-2 shrink-0 rounded-full" style="background:${PAL[i]}"></i>
          <span class="min-w-0 flex-1 truncate">${esc(n)}</span><span class="shrink-0 font-semibold">${short(v)}</span></li>`).join("")}</ul>
      </div>` : empty("이번달 확정 매출이 없습니다."))}
  </div>

  <div class="mt-5 grid grid-cols-1 gap-5 lg:grid-cols-3">
    <div class="lg:col-span-2">${card("최근 회계 전표", (jrRes.data || []).length ? `<ul class="divide-y text-sm">${(jrRes.data || []).map(j => {
      const t = (j.journal_lines || []).reduce((s, l) => s + Number(l.debit), 0);
      return `<li class="flex items-center justify-between py-2"><div class="min-w-0"><p class="truncate font-medium">${esc(j.description || j.entry_no)}</p>
        <p class="text-xs text-gray-400">${j.entry_date} · ${esc(j.entry_no)}</p></div><span class="ml-2 shrink-0 font-semibold">${short(t)}원</span></li>`;
      }).join("")}</ul>` : empty("전표가 없습니다."))}</div>

    ${card("미수금 상위 거래처", rv.length ? `<ul class="space-y-3">${rv.map(r => `
      <li><div class="mb-1 flex justify-between text-xs"><span class="min-w-0 truncate font-medium">${esc(r.name)}</span><span class="ml-2 shrink-0 font-semibold text-rose-600">${won(r.balance)}</span></div>
      <div class="h-2 w-full rounded-full bg-gray-100"><div class="h-2 rounded-full bg-gradient-to-r from-rose-400 to-rose-600" style="width:${r.balance / rvMax * 100}%"></div></div></li>`).join("")}</ul>` : empty("미수금이 없습니다."))}
  </div>`);
}

/* ===== 품목 ===== */
const ITEM_TYPES = { raw: "원자재", sub: "부자재", semi: "반제품", product: "제품", goods: "상품" };
async function vItems() {
  const { data, error } = await sb.from("items").select("id,item_code,name,spec,unit,item_type,price_in,price_out,safety_stock").eq("is_active", true).order("item_code");
  if (error) throw error;
  h(`${card("품목 등록", `<div class="flex flex-wrap items-end gap-2">
    ${fld("i_code", "품목코드", "w-28")}${fld("i_name", "품목명", "w-40")}${fld("i_spec", "규격", "w-28")}
    <div><label class="mb-1 block text-xs text-gray-500">단위</label><input id="i_unit" value="EA" class="w-16 rounded border border-gray-400 px-2 py-1.5 text-sm"></div>
    <div><label class="mb-1 block text-xs text-gray-500">구분</label><select id="i_type" class="rounded border border-gray-400 px-2 py-1.5 text-sm">${Object.entries(ITEM_TYPES).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}</select></div>
    ${fld("i_in", "입고단가", "w-24", "number", "0")}${fld("i_out", "출고단가", "w-24", "number", "0")}${fld("i_safe", "안전재고", "w-24", "number", "0")}
    <button onclick="saveItem()" class="rounded bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700">등록</button></div>`)}
  <div class="mt-5">${card(`품목 (${(data || []).length})`, (data || []).length ? tbl(
    ["코드", "품목명", "규격", "단위", "구분", "입고단가", "출고단가", "안전재고", ""],
    data.map(r => [esc(r.item_code), esc(r.name), esc(r.spec || ""), esc(r.unit), ITEM_TYPES[r.item_type] || r.item_type,
      won(r.price_in), won(r.price_out), won(r.safety_stock),
      `<button onclick="delRow('items','${r.id}')" class="text-red-600 hover:underline">삭제</button>`]),
    [5, 6, 7]) : empty("등록된 품목이 없습니다."))}</div>`);
}
function fld(id, label, w, type = "text", val = "") {
  return `<div><label class="mb-1 block text-xs text-gray-500">${label}</label><input id="${id}" type="${type}" value="${val}" class="${w} rounded border border-gray-400 px-2 py-1.5 text-sm"></div>`;
}
async function saveItem() {
  const row = { company_id: state.companyId, item_code: $("i_code").value.trim(), name: $("i_name").value.trim(),
    spec: $("i_spec").value.trim() || null, unit: $("i_unit").value.trim() || "EA", item_type: $("i_type").value,
    price_in: Number($("i_in").value) || 0, price_out: Number($("i_out").value) || 0, safety_stock: Number($("i_safe").value) || 0 };
  if (!row.item_code || !row.name) return toast("품목코드와 품목명은 필수입니다", true);
  const { error } = await sb.from("items").insert(row);
  if (error) return toast(error.code === "23505" ? "이미 존재하는 품목코드입니다" : error.message, true);
  toast("등록되었습니다"); route();
}

/* ===== 거래처 ===== */
const P_TYPES = { customer: "매출처", vendor: "매입처", both: "매출+매입" };
async function vPartners() {
  const { data, error } = await sb.from("partners").select("id,partner_code,name,biz_no,ceo_name,partner_type,phone,email").eq("is_active", true).order("partner_code");
  if (error) throw error;
  h(`${card("거래처 등록", `<div class="flex flex-wrap items-end gap-2">
    ${fld("p_code", "코드", "w-24")}${fld("p_name", "상호", "w-40")}${fld("p_biz", "사업자번호", "w-32")}${fld("p_ceo", "대표자", "w-24")}${fld("p_tel", "전화", "w-32")}
    <div><label class="mb-1 block text-xs text-gray-500">구분</label><select id="p_type" class="rounded border border-gray-400 px-2 py-1.5 text-sm">${Object.entries(P_TYPES).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}</select></div>
    <button onclick="savePartner()" class="rounded bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700">등록</button></div>`)}
  <div class="mt-5">${card(`거래처 (${(data || []).length})`, (data || []).length ? tbl(
    ["코드", "상호", "사업자번호", "대표자", "전화", "구분", ""],
    data.map(r => [esc(r.partner_code), esc(r.name), esc(r.biz_no || ""), esc(r.ceo_name || ""), esc(r.phone || ""),
      P_TYPES[r.partner_type] || r.partner_type, `<button onclick="delRow('partners','${r.id}')" class="text-red-600 hover:underline">삭제</button>`])) : empty("등록된 거래처가 없습니다."))}</div>`);
}
async function savePartner() {
  const row = { company_id: state.companyId, partner_code: $("p_code").value.trim(), name: $("p_name").value.trim(),
    biz_no: $("p_biz").value.trim() || null, ceo_name: $("p_ceo").value.trim() || null, phone: $("p_tel").value.trim() || null, partner_type: $("p_type").value };
  if (!row.partner_code || !row.name) return toast("코드와 상호는 필수입니다", true);
  const { error } = await sb.from("partners").insert(row);
  if (error) return toast(error.code === "23505" ? "이미 존재하는 거래처코드입니다" : error.message, true);
  toast("등록되었습니다"); route();
}
async function delRow(table, id) {
  if (!confirm("삭제하시겠습니까?")) return;
  const { error } = await sb.from(table).delete().eq("id", id);
  if (error) return toast(error.message, true);
  toast("삭제되었습니다"); route();
}

/* ===== 현재고 ===== */
async function vStock() {
  const [cs, it, wh] = await Promise.all([
    sb.from("current_stock").select("item_id,warehouse_id,qty"),
    sb.from("items").select("id,item_code,name,unit,safety_stock").eq("is_active", true),
    sb.from("warehouses").select("id,name"),
  ]);
  const im = new Map((it.data || []).map(i => [i.id, i])), wm = new Map((wh.data || []).map(w => [w.id, w.name]));
  const rows = (cs.data || []).map(s => ({ ...s, item: im.get(s.item_id), wh: wm.get(s.warehouse_id) }))
    .sort((a, b) => (a.item?.item_code || "").localeCompare(b.item?.item_code || ""));
  const tot = new Map(); rows.forEach(r => tot.set(r.item_id, (tot.get(r.item_id) || 0) + Number(r.qty)));
  const shortage = (it.data || []).filter(i => Number(i.safety_stock) > 0 && (tot.get(i.id) || 0) < Number(i.safety_stock));
  h(`${shortage.length ? card(`안전재고 부족 (${shortage.length})`, tbl(["품목", "안전재고", "현재고", "부족수량"],
      shortage.map(i => [`[${esc(i.item_code)}] ${esc(i.name)}`, won(i.safety_stock), won(tot.get(i.id) || 0),
        `<span class="font-semibold text-red-600">${won(Number(i.safety_stock) - (tot.get(i.id) || 0))}</span>`]), [1, 2, 3])) : ""}
  <div class="${shortage.length ? "mt-5" : ""}">${card(`현재고 (${rows.length})`, rows.length ? tbl(
    ["품목코드", "품목명", "창고", "현재고", "단위"],
    rows.map(r => [esc(r.item?.item_code || "?"), esc(r.item?.name || "?"), esc(r.wh || "?"),
      `<span class="font-medium ${Number(r.qty) < 0 ? "text-red-600" : ""}">${won(r.qty)}</span>`, esc(r.item?.unit || "")]), [3]) : empty("재고 데이터가 없습니다."))}</div>`);
}

/* ===== 재고수불부 ===== */
async function vLedger() {
  const q = new URLSearchParams(location.hash.split("?")[1] || "");
  const from = q.get("from") || today().slice(0, 8) + "01", to = q.get("to") || today();
  const { data, error } = await sb.rpc("stock_ledger", { p_from: from, p_to: to });
  if (error) throw error;
  h(card("재고수불부", `
    <div class="mb-4 flex flex-wrap items-end gap-2">
      <div><label class="mb-1 block text-xs text-gray-500">시작일</label><input id="l_from" type="date" value="${from}" class="rounded border border-gray-400 px-2 py-1.5 text-sm"></div>
      <div><label class="mb-1 block text-xs text-gray-500">종료일</label><input id="l_to" type="date" value="${to}" class="rounded border border-gray-400 px-2 py-1.5 text-sm"></div>
      <button onclick="location.hash='#/ledger?from='+document.getElementById('l_from').value+'&to='+document.getElementById('l_to').value" class="rounded bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700">조회</button>
    </div>` + ((data || []).length ? tbl(
    ["품목코드", "품목명", "기초재고", "입고", "출고", "기말재고", "단위"],
    data.map(r => [esc(r.item_code), esc(r.item_name), won(r.opening),
      `<span class="text-blue-700">${won(r.in_qty)}</span>`, `<span class="text-red-700">${won(r.out_qty)}</span>`,
      `<span class="font-semibold">${won(r.closing)}</span>`, esc(r.unit)]), [2, 3, 4, 5]) : empty("해당 기간의 수불 내역이 없습니다."))));
}

/* ===== 판매 ===== */
const S_LABEL = { draft: "임시저장", confirmed: "확정", canceled: "취소됨" };
const S_STYLE = { draft: "bg-gray-100 text-gray-600", confirmed: "bg-green-50 text-green-700", canceled: "bg-red-50 text-red-500" };
let saleLines = [{ item_id: "", qty: 1, price: 0 }];
async function vSales() {
  const [docs, partners, items, whs] = await Promise.all([
    sb.from("sales").select("id,doc_no,doc_date,status,partner_id,partners(name),sales_lines(supply_amount,vat_amount)").order("created_at", { ascending: false }).limit(100),
    sb.from("partners").select("id,partner_code,name").eq("is_active", true).order("partner_code"),
    sb.from("items").select("id,item_code,name,price_out").eq("is_active", true).order("item_code"),
    sb.from("warehouses").select("id,name").eq("is_active", true).order("code"),
  ]);
  window._items = items.data || [];
  h(`${card("판매 전표 작성", `
    <div class="mb-3 flex flex-wrap items-end gap-2">
      <div><label class="mb-1 block text-xs text-gray-500">일자</label><input id="s_date" type="date" value="${today()}" class="rounded border border-gray-400 px-2 py-1.5 text-sm"></div>
      <div><label class="mb-1 block text-xs text-gray-500">거래처</label><select id="s_partner" class="w-48 rounded border border-gray-400 px-2 py-1.5 text-sm"><option value="">선택</option>
        ${(partners.data || []).map(p => `<option value="${p.id}">[${esc(p.partner_code)}] ${esc(p.name)}</option>`).join("")}</select></div>
      <div><label class="mb-1 block text-xs text-gray-500">출고 창고</label><select id="s_wh" class="w-36 rounded border border-gray-400 px-2 py-1.5 text-sm">
        ${(whs.data || []).map(w => `<option value="${w.id}">${esc(w.name)}</option>`).join("")}</select></div>
    </div>
    <div id="lineBox"></div>
    <div class="mt-3 flex flex-wrap items-center justify-between gap-2">
      <button onclick="addLine()" class="rounded border border-gray-400 px-3 py-1.5 text-sm hover:bg-gray-50">+ 라인 추가</button>
      <div class="flex items-center gap-4 text-sm"><span id="lineTotal" class="font-semibold"></span>
      <button onclick="saveSale()" class="rounded bg-indigo-600 px-4 py-2 font-medium text-white hover:bg-indigo-700">저장</button></div>
    </div>`)}
  <div class="mt-5">${card(`판매 전표 (${(docs.data || []).length})`, (docs.data || []).length ? tbl(
    ["문서번호", "일자", "거래처", "합계(VAT포함)", "상태", "관리"],
    docs.data.map(d => {
      const t = (d.sales_lines || []).reduce((s, l) => s + Number(l.supply_amount) + Number(l.vat_amount), 0);
      let act = "";
      if (d.status === "draft") act = `<button onclick="confirmSale('${d.id}')" class="font-medium text-green-700 hover:underline">확정</button><button onclick="delRow('sales','${d.id}')" class="ml-3 text-red-600 hover:underline">삭제</button>`;
      else if (d.status === "confirmed") act = `<button onclick="cancelSale('${d.id}')" class="text-red-600 hover:underline">취소</button>`;
      return [esc(d.doc_no), d.doc_date, esc(d.partners?.name || "?"), won(t),
        `<span class="rounded px-2 py-0.5 text-xs font-medium ${S_STYLE[d.status] || ""}">${S_LABEL[d.status] || d.status}</span>`, act];
    }), [3]) : empty("판매 전표가 없습니다."))}</div>`);
  renderLines();
}
function renderLines() {
  $("lineBox").innerHTML = `<div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="border-b bg-gray-50 text-left">
    <th class="p-2 font-semibold">품목</th><th class="w-24 p-2 font-semibold">수량</th><th class="w-28 p-2 font-semibold">단가</th>
    <th class="w-28 p-2 text-right font-semibold">공급가액</th><th class="w-24 p-2 text-right font-semibold">부가세</th><th class="w-10"></th></tr></thead>
    <tbody>${saleLines.map((l, i) => { const sup = l.qty * l.price; return `<tr class="border-b">
      <td class="p-1"><select onchange="setLine(${i},'item_id',this.value)" class="w-full min-w-[10rem] rounded border border-gray-400 px-2 py-1 text-sm"><option value="">선택</option>
        ${window._items.map(it => `<option value="${it.id}" ${l.item_id === it.id ? "selected" : ""}>[${esc(it.item_code)}] ${esc(it.name)}</option>`).join("")}</select></td>
      <td class="p-1"><input type="number" value="${l.qty}" onchange="setLine(${i},'qty',this.value)" class="w-full rounded border border-gray-400 px-2 py-1 text-right text-sm"></td>
      <td class="p-1"><input type="number" value="${l.price}" onchange="setLine(${i},'price',this.value)" class="w-full rounded border border-gray-400 px-2 py-1 text-right text-sm"></td>
      <td class="p-2 text-right">${won(sup)}</td><td class="p-2 text-right text-gray-500">${won(Math.round(sup * 0.1))}</td>
      <td class="p-1 text-center"><button onclick="rmLine(${i})" class="text-lg text-red-500 hover:text-red-700">×</button></td></tr>`; }).join("")}</tbody></table></div>`;
  const total = saleLines.reduce((s, l) => { const sup = l.qty * l.price; return s + sup + Math.round(sup * 0.1); }, 0);
  $("lineTotal").textContent = `합계 ${won(total)}원`;
}
function setLine(i, k, v) {
  if (k === "item_id") { saleLines[i].item_id = v; const it = window._items.find(x => x.id === v); if (it && !saleLines[i].price) saleLines[i].price = Number(it.price_out) || 0; }
  else saleLines[i][k] = Number(v) || 0;
  renderLines();
}
function addLine() { saleLines.push({ item_id: "", qty: 1, price: 0 }); renderLines(); }
function rmLine(i) { saleLines.splice(i, 1); if (!saleLines.length) saleLines = [{ item_id: "", qty: 1, price: 0 }]; renderLines(); }

async function saveSale() {
  const partner = $("s_partner").value, wh = $("s_wh").value, date = $("s_date").value;
  const lines = saleLines.filter(l => l.item_id && l.qty > 0);
  if (!partner) return toast("거래처를 선택하세요", true);
  if (!wh) return toast("창고를 선택하세요", true);
  if (!lines.length) return toast("품목 라인을 1개 이상 입력하세요", true);
  const { data: docNo, error: e1 } = await sb.rpc("next_doc_no", { p_cid: state.companyId, p_type: "sale", p_prefix: "SL" });
  if (e1) return toast(e1.message, true);
  const { data: sale, error: e2 } = await sb.from("sales")
    .insert({ company_id: state.companyId, doc_no: docNo, doc_date: date, partner_id: partner, warehouse_id: wh }).select("id").single();
  if (e2) return toast(e2.message, true);
  const rows = lines.map((l, i) => { const sup = Math.round(l.qty * l.price * 100) / 100;
    return { company_id: state.companyId, sale_id: sale.id, line_no: i + 1, item_id: l.item_id, qty: l.qty, price: l.price, supply_amount: sup, vat_amount: Math.round(sup * 0.1) }; });
  const { error: e3 } = await sb.from("sales_lines").insert(rows);
  if (e3) { await sb.from("sales").delete().eq("id", sale.id); return toast(e3.message, true); }
  saleLines = [{ item_id: "", qty: 1, price: 0 }];
  toast(`저장되었습니다 (${docNo})`); route();
}
async function confirmSale(id) {
  if (!confirm("확정하면 재고가 차감되고 자동분개가 생성됩니다. 이후 수정할 수 없습니다. 확정할까요?")) return;
  const { error } = await sb.rpc("confirm_sale", { p_sale: id });
  if (error) return toast(error.message, true);
  toast("확정되었습니다"); route();
}
async function cancelSale(id) {
  if (!confirm("취소하면 재고가 복원되고 역분개가 생성됩니다. 진행할까요?")) return;
  const { error } = await sb.rpc("cancel_sale", { p_sale: id });
  if (error) return toast(error.message, true);
  toast("취소되었습니다"); route();
}

/* ===== 수금·미수금 ===== */
const R_METHOD = { cash: "현금", transfer: "계좌이체", card: "카드", note: "어음" };
async function vReceipts() {
  const [bal, recent] = await Promise.all([
    sb.from("partner_receivables").select("partner_id,partner_code,partner_name,sales_total,received_total,balance").order("balance", { ascending: false }),
    sb.from("receipts").select("id,receipt_date,amount,method,memo,partners(name)").order("created_at", { ascending: false }).limit(20),
  ]);
  const rows = (bal.data || []).filter(b => Number(b.sales_total) > 0 || Number(b.received_total) > 0);
  h(`${card("수금 등록", `<div class="flex flex-wrap items-end gap-2">
    <div><label class="mb-1 block text-xs text-gray-500">거래처</label><select id="r_partner" class="w-64 rounded border border-gray-400 px-2 py-1.5 text-sm"><option value="">선택</option>
      ${rows.map(b => `<option value="${b.partner_id}">[${esc(b.partner_code)}] ${esc(b.partner_name)} · 잔액 ${won(b.balance)}</option>`).join("")}</select></div>
    <div><label class="mb-1 block text-xs text-gray-500">수금일</label><input id="r_date" type="date" value="${today()}" class="rounded border border-gray-400 px-2 py-1.5 text-sm"></div>
    ${fld("r_amt", "수금액", "w-32", "number")}
    <div><label class="mb-1 block text-xs text-gray-500">수단</label><select id="r_method" class="rounded border border-gray-400 px-2 py-1.5 text-sm">${Object.entries(R_METHOD).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}</select></div>
    ${fld("r_memo", "메모", "w-40")}
    <button onclick="saveReceipt()" class="rounded bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700">수금 등록</button></div>`)}
  <div class="mt-5 grid grid-cols-1 gap-5 xl:grid-cols-2">
    ${card("거래처별 미수금", rows.length ? tbl(["거래처", "매출누계", "수금누계", "잔액"],
      rows.map(b => [`[${esc(b.partner_code)}] ${esc(b.partner_name)}`, won(b.sales_total), won(b.received_total),
        `<span class="font-semibold ${Number(b.balance) > 0 ? "text-red-600" : "text-gray-500"}">${won(b.balance)}</span>`]), [1, 2, 3]) : empty("채권 내역이 없습니다."))}
    ${card("최근 수금", (recent.data || []).length ? tbl(["수금일", "거래처", "금액", "수단"],
      recent.data.map(r => [r.receipt_date, esc(r.partners?.name || "?"), won(r.amount), R_METHOD[r.method] || r.method]), [2]) : empty("수금 이력이 없습니다."))}
  </div>`);
}
async function saveReceipt() {
  const row = { company_id: state.companyId, partner_id: $("r_partner").value, receipt_date: $("r_date").value,
    amount: Number($("r_amt").value) || 0, method: $("r_method").value, memo: $("r_memo").value.trim() || null };
  if (!row.partner_id) return toast("거래처를 선택하세요", true);
  if (row.amount <= 0) return toast("수금액을 입력하세요", true);
  const { error } = await sb.from("receipts").insert(row);
  if (error) return toast(error.message, true);
  toast("수금이 등록되었습니다"); route();
}

/* ===== 시작 ===== */
sb.auth.onAuthStateChange((e) => { if (e === "SIGNED_OUT") show("loginView"); });
boot();
</script>
