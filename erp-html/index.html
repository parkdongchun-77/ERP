<style>

  /* 인쇄: 명세서 영역만 출력 */
  #printView { display: none; }
  @media print {
    body > *:not(#printView) { display: none !important; }

    @page { margin: 14mm; }
  }
  .pv { font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; color: #000; font-size: 12px; }
  .pv h1 { font-size: 22px; letter-spacing: .4em; text-align: center; margin: 0 0 16px; }
  .pv table { width: 100%; border-collapse: collapse; }

  .pv .r { text-align: right; } .pv .c { text-align: center; }
  .pv .meta td { border: none; padding: 2px 0; }

  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  .fade { animation: f .18s ease; } @keyframes f { from { opacity:0; transform: translateY(4px);} to {opacity:1;transform:none} }

<body class="bg-gray-50 text-gray-900">

<!-- 로그인 -->
<div id="loginView" class="hidden min-h-screen items-center justify-center p-4">

    <h1 class="mb-1 text-center text-2xl font-extrabold text-gray-900">ERP System</h1>
    <p class="mb-6 text-center text-xs text-gray-500">통합 관리 시스템</p>
    <p id="loginMsg" class="mb-4 hidden rounded bg-red-50 p-2 text-sm text-red-600"></p>
    <label class="mb-1 block text-sm font-semibold text-gray-900">이메일</label>
    <input id="email" type="email" autocomplete="username" class="mb-4 w-full rounded border border-gray-400 px-3 py-2 text-sm">
    <label class="mb-1 block text-sm font-semibold text-gray-900">비밀번호</label>
    <input id="password" type="password" autocomplete="current-password" class="mb-5 w-full rounded border border-gray-400 px-3 py-2 text-sm">
    <button onclick="doLogin()" class="w-full rounded bg-indigo-600 py-2.5 text-sm font-semibold text-white hover:bg-indigo-700">로그인</button>

      관리자 전용 페이지입니다.<br>계정은 운영자에게 문의하세요.</p>
  </div>
</div>

<!-- 접근 거부 -->
<div id="denyView" class="hidden min-h-screen items-center justify-center p-4">
  <div class="w-full max-w-sm rounded-2xl border bg-white p-8 text-center shadow-sm">
    <p class="mb-3 text-3xl">🔒</p>
    <h1 class="mb-2 text-lg font-bold">접근 권한이 없습니다</h1>
    <p id="denyMsg" class="mb-6 text-sm leading-relaxed text-gray-500"></p>
    <button onclick="doLogout()" class="w-full rounded border border-gray-400 py-2.5 text-sm font-semibold text-gray-900 hover:bg-gray-100">로그아웃</button>
  </div>
</div>

<!-- 앱 -->
<div id="appView" class="hidden min-h-screen">
  <div class="sticky top-0 z-30 flex items-center justify-between border-b bg-white px-4 py-3 lg:hidden">
    <button onclick="toggleNav()" class="rounded px-2 py-1 hover:bg-gray-100">☰</button>
    <span id="mCompany" class="truncate text-sm font-bold"></span>
    <button onclick="doLogout()" class="text-xs text-gray-500">로그아웃</button>
  </div>
  <div class="flex">
    <aside id="nav" class="fixed inset-y-0 left-0 z-40 hidden w-56 shrink-0 flex-col border-r bg-white lg:sticky lg:top-0 lg:flex lg:h-screen">
      <a href="#/" onclick="closeNav()" class="block border-b p-4 hover:bg-gray-50">
        <p id="companyLabel" class="truncate text-sm font-bold"></p>
        <p id="userLabel" class="mt-0.5 truncate text-xs text-gray-400"></p>
      </a>
      <nav id="menu" class="flex-1 overflow-y-auto p-2 text-sm"></nav>
      <div class="border-t p-2">
        <button onclick="doLogout()" class="w-full rounded px-3 py-2 text-left text-sm text-gray-500 hover:bg-gray-100">로그아웃</button>
      </div>
    </aside>
    <div id="navBackdrop" onclick="closeNav()" class="fixed inset-0 z-30 hidden bg-black/30 lg:hidden"></div>
    <main id="main" class="min-w-0 flex-1 p-4 lg:p-6"></main>
  </div>
</div>

<div id="toast" class="fixed bottom-5 left-1/2 z-50 hidden -translate-x-1/2 rounded-lg px-4 py-2.5 text-sm text-white shadow-lg"></div>
<div id="printView" class="pv"></div>
<input id="xlFile" type="file" accept=".xlsx,.xls" class="hidden">

<script>
/* ===== 설정 ===== */

const ANON_KEY = "eyJhbGciOiAiSFMyNTYiLCAidHlwIjogIkpXVCJ9.eyJyb2xlIjogImFub24iLCAiaXNzIjogInN1cGFiYXNlIiwgImlhdCI6IDE3ODc0NTU0NDgsICJleHAiOiAyMTAyODE1NDQ4fQ.ZjBsOo3e4-vryCKqhX2DeBIkq9mEzmEmkMbKiYgy6lc";
const sb = window.supabase.createClient(SUPABASE_URL, ANON_KEY);

const MENU = [
  { group: null, items: [["", "대시보드"]] },
  { group: "기준정보", items: [["items", "품목"], ["partners", "거래처"], ["warehouses", "창고"], ["departments", "부서"], ["employees", "사원"], ["accounts", "계정과목"]] },
  { group: "재고", items: [["stock", "현재고"], ["ledger", "재고수불부"], ["adjust", "재고조정"], ["transfer", "창고이동"]] },

/* ===== 유틸 ===== */
const $ = (id) => document.getElementById(id);
const won = (n) => (Number(n) || 0).toLocaleString();
const short = (n) => { n = Number(n) || 0; if (Math.abs(n) >= 1e8) return (n/1e8).toFixed(1)+"억"; if (Math.abs(n) >= 1e4) return Math.round(n/1e4).toLocaleString()+"만"; return n.toLocaleString(); };
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const today = () => new Date().toISOString().slice(0, 10);
const monthStart = () => today().slice(0, 8) + "01";
const monthKey = (off) => { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - off); return d.toISOString().slice(0, 7); };
const val = (id) => ($(id) ? $(id).value : "");
const num = (id) => Number(val(id)) || 0;
const qs = () => new URLSearchParams(location.hash.split("?")[1] || "");
const goto = (key, params) => { location.hash = "#/" + key + (params ? "?" + new URLSearchParams(params).toString() : ""); };

function toast(msg, err) {
  const t = $("toast"); t.textContent = msg;
  t.className = "fixed bottom-5 left-1/2 z-50 -translate-x-1/2 rounded-lg px-4 py-2.5 text-sm text-white shadow-lg " + (err ? "bg-red-600" : "bg-gray-900");
  clearTimeout(window._tt); window._tt = setTimeout(() => t.classList.add("hidden"), 3000);
}
function show(v) {
  ["loginView", "denyView", "appView"].forEach(x => { const e = $(x); e.classList.add("hidden"); e.classList.remove("flex"); });
  const e = $(v); e.classList.remove("hidden"); if (v !== "appView") e.classList.add("flex");
}
function deny(msg) { $("denyMsg").textContent = msg; show("denyView"); }
function toggleNav() { $("nav").classList.toggle("hidden"); $("nav").classList.toggle("flex"); $("navBackdrop").classList.toggle("hidden"); }
function closeNav() { if (window.innerWidth < 1024) { $("nav").classList.add("hidden"); $("nav").classList.remove("flex"); $("navBackdrop").classList.add("hidden"); } }

/* ===== 인증 ===== */
async function doLogin() {
  const { error } = await sb.auth.signInWithPassword({ email: val("email").trim(), password: val("password") });
  if (error) { $("loginMsg").textContent = error.message; $("loginMsg").classList.remove("hidden"); return; }
  await boot();
}
async function doLogout() { await sb.auth.signOut(); location.hash = ""; show("loginView"); }

// 관리자 전용: owner/admin 이외 역할은 앱 진입 차단
const ADMIN_ROLES = ["owner", "admin"];

async function boot() {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) return show("loginView");
  state.user = user;
  const { data: m } = await sb.from("memberships").select("company_id, role, companies(name)").limit(1).maybeSingle();
  if (!m) return deny(`${user.email} 계정은 소속된 회사가 없습니다. 운영자에게 초대를 요청하세요.`);
  if (!ADMIN_ROLES.includes(m.role)) return deny(`${user.email} 계정의 권한은 '${m.role}' 입니다. 이 페이지는 관리자(owner·admin)만 사용할 수 있습니다.`);
  state.companyId = m.company_id; state.role = m.role; state.companyName = m.companies?.name ?? "회사";
  $("companyLabel").textContent = state.companyName;
  $("mCompany").textContent = state.companyName;
  $("userLabel").textContent = user.email;
  $("menu").innerHTML = MENU.map(sec =>
    (sec.group ? `<p class="mt-3 px-3 pb-1 text-[11px] font-bold uppercase tracking-wide text-gray-400">${sec.group}</p>` : "") +
    sec.items.map(([k, l]) => `<a href="#/${k}" onclick="closeNav()" data-k="${k}" class="mi block rounded px-3 py-1.5 text-gray-700 hover:bg-gray-100">${l}</a>`).join("")
  ).join("");
  show("appView");
  route();
}

/* ===== 라우팅 ===== */
const VIEWS = {
  "": vDashboard,
  items: vItems, partners: vPartners,
  warehouses: () => vSimple("warehouses"), departments: () => vSimple("departments"), employees: () => vSimple("employees"),
  accounts: vAccounts,
  stock: vStock, ledger: vLedger, adjust: vAdjust, transfer: vTransfer,
  quotes: () => vDoc("quote"), orders: () => vDoc("order"), sales: () => vDoc("sale"),
  po: () => vDoc("po"), purchases: () => vDoc("purchase"),
  receipts: () => vSettle("receipt"), payments: () => vSettle("payment"),
  "purchase-summary": vPurchaseSummary,
  journal: vJournal, reports: vReports, "partner-ledger": vPartnerLedger, "journal-map": vJournalMap,
  bom: vBom, "work-orders": vWorkOrders, mrp: vMrp,
  payroll: vPayroll, "payroll-detail": vPayrollDetail, attendance: vAttendance,
  approvals: vApprovals, board: vBoard, calendar: vCalendar,
};
window.addEventListener("hashchange", route);
function route() {
  if (!state.companyId) return;
  const key = location.hash.replace(/^#\/?/, "").split("?")[0];
  document.querySelectorAll(".mi").forEach(a => a.className = "mi block rounded px-3 py-1.5 hover:bg-gray-100 " + (a.dataset.k === key ? "bg-indigo-50 font-semibold text-indigo-700" : "text-gray-700"));
  $("main").innerHTML = `<div class="py-16 text-center text-sm text-gray-400">불러오는 중…</div>`;
  (VIEWS[key] || vDashboard)().catch(e => { $("main").innerHTML = `<div class="rounded bg-red-50 p-4 text-sm text-red-600">${esc(e.message || e)}</div>`; });
}
function h(html) { $("main").innerHTML = `<div class="fade space-y-5">${html}</div>`; }
const card = (t, b) => `<section class="rounded-2xl border bg-white p-5 shadow-sm"><h2 class="mb-3 text-sm font-bold text-gray-800">${t}</h2>${b}</section>`;
const empty = (m) => `<p class="py-8 text-center text-sm text-gray-400">${m}</p>`;
function tbl(headers, rows, rightCols = []) {
  const R = new Set(rightCols);
  if (!rows.length) return empty("데이터가 없습니다.");
  return `<div class="-mx-2 overflow-x-auto px-2"><table class="w-full border-collapse text-sm">
    <thead><tr class="border-b bg-gray-50 text-left">${headers.map((x, i) => `<th class="whitespace-nowrap p-2 font-semibold ${R.has(i) ? "text-right" : ""}">${x}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(r => `<tr class="border-b hover:bg-gray-50">${r.map((c, i) => `<td class="whitespace-nowrap p-2 ${R.has(i) ? "text-right" : ""}">${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}
function fld(id, label, w = "w-32", type = "text", value = "") {
  return `<div><label class="mb-1 block text-xs text-gray-500">${label}</label><input id="${id}" type="${type}" value="${value}" class="inp ${w}"></div>`;
}
function sel(id, label, opts, w = "w-48", cur = "") {
  return `<div><label class="mb-1 block text-xs text-gray-500">${label}</label><select id="${id}" class="inp ${w}">${opts.map(([v, l]) => `<option value="${v}" ${v === cur ? "selected" : ""}>${l}</option>`).join("")}</select></div>`;
}
const btn = (onclick, label, cls = "bg-indigo-600 text-white hover:bg-indigo-700") =>
  `<button onclick="${onclick}" class="rounded px-4 py-2 text-sm font-medium ${cls}">${label}</button>`;
async function delRow(table, id, msg) {
  if (!confirm(msg || "삭제하시겠습니까?")) return;
  const { error } = await sb.from(table).delete().eq("id", id);
  if (error) return toast(error.message, true);
  toast("삭제되었습니다"); route();
}

/* ===== 엑셀 가져오기 / 내보내기 (품목·거래처) ===== */
// 헤더는 한국어 그대로 쓴다. 코드 중복은 건너뛰고 건수를 보고한다.
const XL = {
  items: {
    sheet: "품목", codeKey: "품목코드",
    cols: [["item_code", "품목코드"], ["name", "품목명"], ["spec", "규격"], ["unit", "단위"], ["item_type", "구분"],
           ["price_in", "입고단가"], ["price_out", "출고단가"], ["safety_stock", "안전재고"]],
    sample: { 품목코드: "A-100", 품목명: "노트북 거치대", 규격: "알루미늄", 단위: "EA", 구분: "상품", 입고단가: 12000, 출고단가: 19900, 안전재고: 20 },
    toRow: (r) => ({
      item_code: String(r["품목코드"] ?? "").trim(), name: String(r["품목명"] ?? "").trim(),
      spec: String(r["규격"] ?? "").trim() || null, unit: String(r["단위"] ?? "EA").trim() || "EA",
      item_type: Object.entries(ITEM_TYPES).find(([, v]) => v === String(r["구분"] ?? "").trim())?.[0] || "goods",
      price_in: Number(r["입고단가"]) || 0, price_out: Number(r["출고단가"]) || 0, safety_stock: Number(r["안전재고"]) || 0 }),
    fromRow: (r) => ({ 품목코드: r.item_code, 품목명: r.name, 규격: r.spec || "", 단위: r.unit, 구분: ITEM_TYPES[r.item_type] || r.item_type,
      입고단가: Number(r.price_in), 출고단가: Number(r.price_out), 안전재고: Number(r.safety_stock) }),
    required: (row) => row.item_code && row.name,
  },
  partners: {
    sheet: "거래처", codeKey: "코드",
    cols: [["partner_code", "코드"], ["name", "상호"], ["biz_no", "사업자번호"], ["ceo_name", "대표자"],
           ["phone", "전화"], ["email", "이메일"], ["partner_type", "구분"]],
    sample: { 코드: "C-001", 상호: "한빛유통", 사업자번호: "123-45-67890", 대표자: "홍길동", 전화: "02-1234-5678", 이메일: "", 구분: "매출처" },
    toRow: (r) => ({
      partner_code: String(r["코드"] ?? "").trim(), name: String(r["상호"] ?? "").trim(),
      biz_no: String(r["사업자번호"] ?? "").trim() || null, ceo_name: String(r["대표자"] ?? "").trim() || null,
      phone: String(r["전화"] ?? "").trim() || null, email: String(r["이메일"] ?? "").trim() || null,
      partner_type: Object.entries(P_TYPES).find(([, v]) => v === String(r["구분"] ?? "").trim())?.[0] || "both" }),
    fromRow: (r) => ({ 코드: r.partner_code, 상호: r.name, 사업자번호: r.biz_no || "", 대표자: r.ceo_name || "",
      전화: r.phone || "", 이메일: r.email || "", 구분: P_TYPES[r.partner_type] || r.partner_type }),
    required: (row) => row.partner_code && row.name,
  },
};
function xlBar(kind) {
  return `<div class="mt-3 flex flex-wrap items-center gap-2 border-t pt-3 text-xs text-gray-500">
    <span class="font-semibold text-gray-700">엑셀</span>
    ${btn(`xlTemplate('${kind}')`, "양식 받기", "border border-gray-400 hover:bg-gray-50")}
    ${btn(`xlPick('${kind}')`, "가져오기(.xlsx)", "border border-gray-400 hover:bg-gray-50")}
    ${btn(`xlExport('${kind}')`, "내보내기", "border border-gray-400 hover:bg-gray-50")}
    <span>· 양식의 열 이름을 그대로 두고 채우세요. 코드가 이미 있으면 그 행은 건너뜁니다.</span></div>`;
}
function xlSave(rows, sheet, filename) {
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, sheet);
  XLSX.writeFile(wb, filename);
}
function xlTemplate(kind) {
  const c = XL[kind];
  xlSave([c.sample], c.sheet, `${c.sheet}_양식.xlsx`);
}
async function xlExport(kind) {
  const c = XL[kind];
  const { data, error } = await sb.from(kind).select(c.cols.map(x => x[0]).join(",")).eq("is_active", true).order(c.cols[0][0]);
  if (error) return toast(error.message, true);
  if (!data.length) return toast("내보낼 데이터가 없습니다", true);
  xlSave(data.map(c.fromRow), c.sheet, `${c.sheet}_${today()}.xlsx`);
  toast(`${data.length}건 내보냈습니다`);
}
function xlPick(kind) {
  const inp = $("xlFile");
  inp.value = "";
  inp.onchange = () => { if (inp.files[0]) xlImport(kind, inp.files[0]); };
  inp.click();
}
async function xlImport(kind, file) {
  const c = XL[kind];
  let rows;
  try {
    const wb = XLSX.read(await file.arrayBuffer(), { type: "array" });
    rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: "" });
  } catch (e) { return toast("파일을 읽지 못했습니다: " + e.message, true); }
  if (!rows.length) return toast("시트에 데이터가 없습니다", true);
  if (!(c.codeKey in rows[0])) return toast(`'${c.codeKey}' 열이 없습니다. 양식 파일을 사용하세요.`, true);

  const parsed = rows.map(c.toRow);
  const bad = parsed.filter(r => !c.required(r)).length;
  const valid = parsed.filter(c.required);
  const codeCol = c.cols[0][0];
  const { data: existing } = await sb.from(kind).select(codeCol);
  const have = new Set((existing || []).map(r => r[codeCol]));
  const seen = new Set();
  const fresh = valid.filter(r => { const k = r[codeCol]; if (have.has(k) || seen.has(k)) return false; seen.add(k); return true; });
  const dup = valid.length - fresh.length;
  if (!fresh.length) return toast(`추가할 행이 없습니다 (중복 ${dup}, 필수값 누락 ${bad})`, true);

  const { error } = await sb.from(kind).insert(fresh.map(r => ({ company_id: state.companyId, ...r })));
  if (error) return toast(error.message, true);
  toast(`${fresh.length}건 추가${dup ? `, 중복 ${dup}건 건너뜀` : ""}${bad ? `, 필수값 누락 ${bad}건 제외` : ""}`);
  route();
}
const opt = (rows, v, l) => rows.map(r => [r[v], typeof l === "function" ? l(r) : r[l]]);

    sb.from("sales").select("sales_lines(supply_amount, vat_amount, items(name))").eq("status", "confirmed").gte("doc_date", cur + "-01"),

  }));
  const top = [...byItem.entries()].sort((a, b) => b[1] - a[1]).slice(0, 5);

  <div class="grid grid-cols-1 gap-5 lg:grid-cols-3">
    <div class="lg:col-span-2">${card("최근 회계 전표", (jrRes.data || []).length ? `<ul class="divide-y text-sm">${(jrRes.data || []).map(j => {

/* ===== 문서 공용 모듈 (견적/주문/판매/발주/구매) ===== */
const DOC = {
  quote:    { title: "견적서", table: "quotes", lineTable: "quote_lines", fk: "quote_id", counter: "quote", prefix: "QT", price: "price_out", wh: false },
  order:    { title: "주문서", table: "sales_orders", lineTable: "sales_order_lines", fk: "order_id", counter: "sales_order", prefix: "SO", price: "price_out", wh: false },
  sale:     { title: "판매(출고)", table: "sales", lineTable: "sales_lines", fk: "sale_id", counter: "sale", prefix: "SL", price: "price_out", wh: "출고 창고" },
  po:       { title: "발주서", table: "purchase_orders", lineTable: "purchase_order_lines", fk: "order_id", counter: "purchase_order", prefix: "PO", price: "price_in", wh: false },
  purchase: { title: "구매(입고)", table: "purchases", lineTable: "purchase_lines", fk: "purchase_id", counter: "purchase", prefix: "PU", price: "price_in", wh: "입고 창고" },
};
const ST_LABEL = { draft: "임시저장", converted: "변환됨", confirmed: "확정", canceled: "취소됨", closed: "마감" };
const ST_STYLE = { draft: "bg-gray-100 text-gray-600", converted: "bg-blue-50 text-blue-600", confirmed: "bg-green-50 text-green-700", canceled: "bg-red-50 text-red-500", closed: "bg-blue-50 text-blue-600" };

let docState = { type: "sale", id: null, lines: [{ item_id: "", qty: 1, price: 0 }], items: [] };

async function vDoc(type) {
  const c = DOC[type];
  if (docState.type !== type) docState = { type, id: null, lines: [{ item_id: "", qty: 1, price: 0 }], items: [] };
  const sel1 = `id,doc_no,doc_date,partner_id,status,memo${c.wh ? ",warehouse_id" : ""},partners(name),${c.lineTable}(line_no,item_id,qty,price,supply_amount,vat_amount)`;
  const [docs, partners, items, whs] = await Promise.all([
    sb.from(c.table).select(sel1).order("created_at", { ascending: false }).limit(100),
    sb.from("partners").select("id,partner_code,name").eq("is_active", true).order("partner_code"),
    sb.from("items").select(`id,item_code,name,${c.price}`).eq("is_active", true).order("item_code"),
    sb.from("warehouses").select("id,name").eq("is_active", true).order("code"),
  ]);
  if (docs.error) throw docs.error;
  docState.items = (items.data || []).map(i => ({ id: i.id, label: `[${i.item_code}] ${i.name}`, price: Number(i[c.price]) || 0 }));
  window._docRows = docs.data || [];

  h(`${card(`${c.title} 작성`, `
    <div class="mb-3 flex flex-wrap items-end gap-2">
      ${fld("d_date", "일자", "w-36", "date", today())}
      ${sel("d_partner", "거래처", [["", "선택"], ...opt(partners.data || [], "id", r => `[${r.partner_code}] ${r.name}`)], "w-56")}
      ${c.wh ? sel("d_wh", c.wh, opt(whs.data || [], "id", "name"), "w-36") : ""}
      ${fld("d_memo", "비고", "w-56")}
      <span id="d_editing" class="pb-2 text-xs font-medium text-indigo-600"></span>
    </div>
    <div id="lineBox"></div>
    <div class="mt-3 flex flex-wrap items-center justify-between gap-2">
      ${btn("addLine()", "+ 라인 추가", "border border-gray-400 hover:bg-gray-50")}
      <div class="flex items-center gap-3 text-sm"><span id="lineTotal" class="font-semibold"></span>
      ${btn("resetDoc()", "초기화", "border border-gray-400 hover:bg-gray-50")}${btn("saveDoc()", "저장")}</div>
    </div>`)}
  ${card(`${c.title} 목록 (${(docs.data || []).length})`, tbl(
    ["문서번호", "일자", "거래처", "합계(VAT포함)", "상태", "관리"],
    (docs.data || []).map(d => {
      const t = (d[c.lineTable] || []).reduce((s, l) => s + Number(l.supply_amount) + Number(l.vat_amount), 0);
      let act = [];
      if (d.status === "draft") {
        act.push(`<button onclick="editDoc('${d.id}')" class="text-blue-600 hover:underline">수정</button>`);
        act.push(`<button onclick="delRow('${c.table}','${d.id}')" class="text-red-600 hover:underline">삭제</button>`);
        if (type === "quote") act.push(`<button onclick="docRpc('convert_quote_to_order','p_quote','${d.id}','주문서로 변환하시겠습니까?')" class="text-green-700 hover:underline">주문 변환</button>`);
        if (type === "order") act.push(`<button onclick="docRpc('convert_order_to_sale','p_order','${d.id}','판매 전표로 변환하시겠습니까?')" class="text-green-700 hover:underline">판매 변환</button>`);
        if (type === "sale") act.push(`<button onclick="docRpc('confirm_sale','p_sale','${d.id}','확정하면 재고가 차감되고 수정할 수 없습니다. 확정할까요?')" class="text-green-700 hover:underline">확정</button>`);
        if (type === "po") act.push(`<button onclick="docRpc('convert_po_to_purchase','p_order','${d.id}','잔량 기준으로 구매 전표를 생성할까요?')" class="text-green-700 hover:underline">구매 변환</button>`);
        if (type === "purchase") act.push(`<button onclick="docRpc('confirm_purchase','p_purchase','${d.id}','확정하면 재고가 입고되고 수정할 수 없습니다. 확정할까요?')" class="text-green-700 hover:underline">확정</button>`);
      }
      if ((type === "sale" || type === "purchase") && d.status === "confirmed")
        act.push(`<button onclick="printDoc('${type}','${d.id}')" class="text-indigo-600 hover:underline">명세서</button>`);
      if (type === "sale" && d.status === "confirmed") act.push(`<button onclick="docRpc('cancel_sale','p_sale','${d.id}','취소하면 재고가 복원되고 역분개가 생성됩니다. 진행할까요?')" class="text-red-600 hover:underline">취소</button>`);
      if (type === "purchase" && d.status === "confirmed") act.push(`<button onclick="docRpc('cancel_purchase','p_purchase','${d.id}','취소하면 입고가 취소됩니다. 진행할까요?')" class="text-red-600 hover:underline">취소</button>`);
      return [esc(d.doc_no), d.doc_date, esc(d.partners?.name || "?"), won(t),
        `<span class="rounded px-2 py-0.5 text-xs font-medium ${ST_STYLE[d.status] || ""}">${ST_LABEL[d.status] || d.status}</span>`, act.join(" ")];
    }), [3]))}`);
  renderLines();
}
function renderLines() {
  const L = docState.lines;
  $("lineBox").innerHTML = `<div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="border-b bg-gray-50 text-left">
    <th class="p-2 font-semibold">품목</th><th class="w-24 p-2 font-semibold">수량</th><th class="w-28 p-2 font-semibold">단가</th>
    <th class="w-28 p-2 text-right font-semibold">공급가액</th><th class="w-24 p-2 text-right font-semibold">부가세</th><th class="w-10"></th></tr></thead>
    <tbody>${L.map((l, i) => { const sup = l.qty * l.price; return `<tr class="border-b">
      <td class="p-1"><select onchange="setLine(${i},'item_id',this.value)" class="inp w-full min-w-[10rem]"><option value="">선택</option>
        ${docState.items.map(it => `<option value="${it.id}" ${l.item_id === it.id ? "selected" : ""}>${esc(it.label)}</option>`).join("")}</select></td>
      <td class="p-1"><input type="number" step="0.0001" value="${l.qty}" onchange="setLine(${i},'qty',this.value)" class="inp w-full text-right"></td>
      <td class="p-1"><input type="number" value="${l.price}" onchange="setLine(${i},'price',this.value)" class="inp w-full text-right"></td>
      <td class="p-2 text-right">${won(sup)}</td><td class="p-2 text-right text-gray-500">${won(Math.round(sup * 0.1))}</td>
      <td class="p-1 text-center"><button onclick="rmLine(${i})" class="text-lg text-red-500 hover:text-red-700">×</button></td></tr>`; }).join("")}</tbody></table></div>`;
  const total = L.reduce((s, l) => { const sup = l.qty * l.price; return s + sup + Math.round(sup * 0.1); }, 0);
  $("lineTotal").textContent = `합계 ${won(total)}원`;
  $("d_editing").textContent = docState.id ? "수정 중" : "";
}
function setLine(i, k, v) {
  if (k === "item_id") { docState.lines[i].item_id = v; const it = docState.items.find(x => x.id === v); if (it && !docState.lines[i].price) docState.lines[i].price = it.price; }
  else docState.lines[i][k] = Number(v) || 0;
  renderLines();
}
function addLine() { docState.lines.push({ item_id: "", qty: 1, price: 0 }); renderLines(); }
function rmLine(i) { docState.lines.splice(i, 1); if (!docState.lines.length) docState.lines = [{ item_id: "", qty: 1, price: 0 }]; renderLines(); }
function resetDoc() { docState.id = null; docState.lines = [{ item_id: "", qty: 1, price: 0 }]; $("d_partner").value = ""; $("d_memo").value = ""; $("d_date").value = today(); renderLines(); }
function editDoc(id) {
  const c = DOC[docState.type];
  const d = (window._docRows || []).find(x => x.id === id);
  if (!d) return;
  docState.id = id;
  docState.lines = [...(d[c.lineTable] || [])].sort((a, b) => a.line_no - b.line_no).map(l => ({ item_id: l.item_id, qty: Number(l.qty), price: Number(l.price) }));
  if (!docState.lines.length) docState.lines = [{ item_id: "", qty: 1, price: 0 }];
  $("d_date").value = d.doc_date; $("d_partner").value = d.partner_id; $("d_memo").value = d.memo || "";
  if (c.wh && $("d_wh")) $("d_wh").value = d.warehouse_id || "";
  renderLines();
  window.scrollTo({ top: 0, behavior: "smooth" });
}
async function saveDoc() {
  const c = DOC[docState.type], cid = state.companyId;
  const lines = docState.lines.filter(l => l.item_id && l.qty > 0);
  if (!val("d_partner")) return toast("거래처를 선택하세요", true);
  if (c.wh && !val("d_wh")) return toast("창고를 선택하세요", true);
  if (!lines.length) return toast("품목 라인을 1개 이상 입력하세요", true);

  const header = { company_id: cid, doc_date: val("d_date"), partner_id: val("d_partner"), memo: val("d_memo").trim() || null };
  if (c.wh) header.warehouse_id = val("d_wh");

  let docId = docState.id, docNo = null;
  if (docId) {
    const { error } = await sb.from(c.table).update(header).eq("id", docId);
    if (error) return toast(error.message, true);
    const { error: e2 } = await sb.from(c.lineTable).delete().eq(c.fk, docId);
    if (e2) return toast(e2.message, true);
  } else {
    const { data: no, error: e1 } = await sb.rpc("next_doc_no", { p_cid: cid, p_type: c.counter, p_prefix: c.prefix });
    if (e1) return toast(e1.message, true);
    docNo = no;
    const { data: created, error: e2 } = await sb.from(c.table).insert({ ...header, doc_no: no }).select("id").single();
    if (e2) return toast(e2.message, true);
    docId = created.id;
  }
  const rows = lines.map((l, i) => { const sup = Math.round(l.qty * l.price * 100) / 100;
    return { company_id: cid, [c.fk]: docId, line_no: i + 1, item_id: l.item_id, qty: l.qty, price: l.price, supply_amount: sup, vat_amount: Math.round(sup * 0.1) }; });
  const { error: e3 } = await sb.from(c.lineTable).insert(rows);
  if (e3) return toast(e3.message, true);
  docState.id = null; docState.lines = [{ item_id: "", qty: 1, price: 0 }];
  toast(docNo ? `저장되었습니다 (${docNo})` : "수정되었습니다"); route();
}
async function docRpc(fn, param, id, msg) {
  if (msg && !confirm(msg)) return;
  const { error } = await sb.rpc(fn, { [param]: id });
  if (error) return toast(error.message, true);
  toast("처리되었습니다"); route();
}

/* ===== 거래명세서 인쇄 ===== */
// 확정된 판매/구매 전표를 인쇄 전용 레이아웃으로 그려 브라우저 인쇄 대화상자를 연다.
async function printDoc(type, id) {
  const c = DOC[type];

    .select(`doc_no,doc_date,memo,partners(name,biz_no,ceo_name,phone),${c.lineTable}(line_no,qty,price,supply_amount,vat_amount,items(item_code,name,spec,unit))`)
    .eq("id", id).single();
  if (error || !d) return toast(error?.message || "전표를 찾을 수 없습니다", true);
  const lines = [...(d[c.lineTable] || [])].sort((a, b) => a.line_no - b.line_no);
  const sup = lines.reduce((s, l) => s + Number(l.supply_amount), 0);
  const vat = lines.reduce((s, l) => s + Number(l.vat_amount), 0);
  const p = d.partners || {};
  const isSale = type === "sale";
  const title = isSale ? "거 래 명 세 서" : "입 고 명 세 서";
  const [supplier, receiver] = isSale ? [state.companyName, p.name] : [p.name, state.companyName];
  const won2 = (n) => Number(n).toLocaleString("ko-KR");
  const rows = lines.map(l => `<tr>
      <td class="c">${l.line_no}</td><td>${esc(l.items?.item_code || "")}</td><td>${esc(l.items?.name || "")}</td>
      <td>${esc(l.items?.spec || "")}</td><td class="c">${esc(l.items?.unit || "")}</td>
      <td class="r">${won2(l.qty)}</td><td class="r">${won2(l.price)}</td>
      <td class="r">${won2(l.supply_amount)}</td><td class="r">${won2(l.vat_amount)}</td></tr>`).join("");
  const blank = Math.max(0, 12 - lines.length);
  const pad = Array.from({ length: blank }, () => `<tr>${"<td>&nbsp;</td>".repeat(9)}</tr>`).join("");
  $("printView").innerHTML = `
    <h1>${title}</h1>
    <table class="meta" style="margin-bottom:10px"><tr>
      <td style="width:50%"><b>문서번호</b> ${esc(d.doc_no)}</td>
      <td style="width:50%;text-align:right"><b>일자</b> ${d.doc_date}</td></tr></table>
    <table style="margin-bottom:12px"><tr>
      <th style="width:14%">공급자</th><td style="width:36%">${esc(supplier || "")}</td>
      <th style="width:14%">공급받는자</th><td style="width:36%">${esc(receiver || "")}</td></tr>
      <tr><th>사업자번호</th><td>${isSale ? "" : esc(p.biz_no || "")}</td><th>사업자번호</th><td>${isSale ? esc(p.biz_no || "") : ""}</td></tr>
      <tr><th>대표자</th><td>${isSale ? "" : esc(p.ceo_name || "")}</td><th>대표자</th><td>${isSale ? esc(p.ceo_name || "") : ""}</td></tr>
      <tr><th>연락처</th><td>${isSale ? "" : esc(p.phone || "")}</td><th>연락처</th><td>${isSale ? esc(p.phone || "") : ""}</td></tr>
    </table>
    <table><thead><tr>
      <th style="width:5%">No</th><th style="width:11%">품목코드</th><th>품목명</th><th style="width:12%">규격</th>
      <th style="width:6%">단위</th><th style="width:8%">수량</th><th style="width:11%">단가</th>
      <th style="width:13%">공급가액</th><th style="width:11%">부가세</th></tr></thead>
      <tbody>${rows}${pad}</tbody>
      <tfoot><tr><th colspan="7" class="r">합 계</th><th class="r">${won2(sup)}</th><th class="r">${won2(vat)}</th></tr>
      <tr><th colspan="7" class="r">총액 (부가세 포함)</th><th colspan="2" class="r" style="font-size:14px">${won2(sup + vat)} 원</th></tr></tfoot>
    </table>
    ${d.memo ? `<p style="margin-top:10px"><b>비고</b> ${esc(d.memo)}</p>` : ""}
    <p style="margin-top:28px;text-align:right">위와 같이 ${isSale ? "거래" : "입고"}하였음을 확인합니다.&nbsp;&nbsp;&nbsp;&nbsp;(인)</p>`;
  setTimeout(() => window.print(), 50);
}

async function vPurchaseSummary() {
  const q = qs(), from = q.get("from") || monthStart(), to = q.get("to") || today();
  const { data, error } = await sb.from("purchases")
    .select("partners(name), purchase_lines(qty, supply_amount, vat_amount, items(item_code, name))")
    .eq("status", "confirmed").gte("doc_date", from).lte("doc_date", to);
  if (error) throw error;
  const byPartner = new Map(), byItem = new Map();
  let grand = 0;
  (data || []).forEach(p => {
    const pn = p.partners?.name || "?";
    (p.purchase_lines || []).forEach(l => {
      const amt = Number(l.supply_amount) + Number(l.vat_amount);
      grand += amt;
      byPartner.set(pn, (byPartner.get(pn) || 0) + amt);
      const k = l.items?.item_code || "?";
      const cur = byItem.get(k) || { name: l.items?.name || "?", qty: 0, amount: 0 };
      byItem.set(k, { name: cur.name, qty: cur.qty + Number(l.qty), amount: cur.amount + amt });
    });
  });
  h(`${card("구매현황 조회", `<div class="flex flex-wrap items-end gap-2">
      ${fld("ps_from", "시작일", "w-36", "date", from)}${fld("ps_to", "종료일", "w-36", "date", to)}
      ${btn("goto('purchase-summary',{from:val('ps_from'),to:val('ps_to')})", "조회")}
      <span class="pb-2 text-sm text-gray-600">기간 매입 합계(VAT 포함): <b>${won(grand)}원</b></span></div>`)}
  <div class="grid grid-cols-1 gap-5 lg:grid-cols-2">
    ${card("거래처별 매입", tbl(["거래처", "금액"], [...byPartner.entries()].sort((a, b) => b[1] - a[1]).map(([n, v]) => [esc(n), won(v)]), [1]))}
    ${card("품목별 매입", tbl(["품목", "수량", "금액"], [...byItem.entries()].sort((a, b) => b[1].amount - a[1].amount).map(([c, r]) => [`[${esc(c)}] ${esc(r.name)}`, won(r.qty), won(r.amount)]), [1, 2]))}
  </div>`);
}

function setJ(i, k, v) { jLines[i][k] = k === "memo" || k === "account_code" ? v : Number(v) || 0; renderJLines(); }
function addJLine() { jLines.push({ account_code: "", debit: 0, credit: 0, memo: "" }); renderJLines(); }
function rmJ(i) { jLines.splice(i, 1); if (!jLines.length) jLines = [{ account_code: "", debit: 0, credit: 0, memo: "" }]; renderJLines(); }
async function saveJournal() {
  const lines = jLines.filter(l => l.account_code && (l.debit > 0 || l.credit > 0));
  if (lines.length < 2) return toast("라인을 2개 이상 입력하세요", true);
  const d = lines.reduce((s, l) => s + l.debit, 0), c = lines.reduce((s, l) => s + l.credit, 0);
  if (d !== c) return toast("차변과 대변 합계가 일치해야 합니다", true);
  const { error } = await sb.rpc("create_journal_entry", {
    p_cid: state.companyId, p_date: val("j_date"), p_description: val("j_desc").trim() || null,
    p_source_type: "manual", p_source_id: null,
    p_lines: lines.map(l => ({ account_code: l.account_code, debit: l.debit, credit: l.credit, memo: l.memo || null })) });
  if (error) return toast(error.message, true);
  jLines = [{ account_code: "", debit: 0, credit: 0, memo: "" }];
  toast("전표가 생성되었습니다"); route();
}

async function vReports() {
  const to = qs().get("to") || today();
  const { data, error } = await sb.rpc("trial_balance", { p_to: to });
  if (error) throw error;
  const rows = (data || []).map(r => ({ ...r, debit_total: Number(r.debit_total), credit_total: Number(r.credit_total), balance: Number(r.balance) }));
  const dSum = rows.reduce((s, r) => s + r.debit_total, 0), cSum = rows.reduce((s, r) => s + r.credit_total, 0);
  const pick = (cat) => rows.filter(r => r.category === cat);
  const rev = pick("revenue"), exp = pick("expense"), ast = pick("asset"), lia = pick("liability"), eqt = pick("equity");
  const revT = rev.reduce((s, r) => s - r.balance, 0), expT = exp.reduce((s, r) => s + r.balance, 0), net = revT - expT;
  const astT = ast.reduce((s, r) => s + r.balance, 0), liaT = lia.reduce((s, r) => s - r.balance, 0), eqtT = eqt.reduce((s, r) => s - r.balance, 0) + net;
  const line = (l, v, cls = "") => `<tr class="border-b ${cls}"><td class="p-2">${l}</td><td class="p-2 text-right">${won(v)}</td></tr>`;
  h(`${card("재무보고서 기준일", `<div class="flex items-end gap-2">${fld("rp_to", "기준일", "w-36", "date", to)}${btn("goto('reports',{to:val('rp_to')})", "조회")}</div>`)}
  ${dSum !== cSum ? `<p class="rounded bg-red-50 p-3 text-sm font-medium text-red-600">경고: 차변(${won(dSum)})과 대변(${won(cSum)})이 일치하지 않습니다.</p>` : ""}
  ${card(`합계잔액시산표 — 차변 ${won(dSum)} = 대변 ${won(cSum)}`, tbl(["코드", "계정과목", "차변합계", "대변합계", "잔액"],
    rows.map(r => [esc(r.code), esc(r.name), won(r.debit_total), won(r.credit_total), `<span class="font-medium">${won(r.balance)}</span>`]), [2, 3, 4]))}
  <div class="grid grid-cols-1 gap-5 lg:grid-cols-2">
    ${card("손익계산서", `<table class="w-full border-collapse text-sm"><tbody>
      ${rev.map(r => line(esc(r.name), -r.balance)).join("")}
      ${line("<b>수익 합계</b>", revT, "bg-gray-50")}
      ${exp.map(r => line(esc(r.name), r.balance)).join("")}
      ${line("<b>비용 합계</b>", expT, "bg-gray-50")}
      <tr class="bg-indigo-50 font-bold"><td class="p-2">당기순이익</td><td class="p-2 text-right ${net < 0 ? "text-red-600" : ""}">${won(net)}</td></tr>
    </tbody></table>`)}
    ${card("재무상태표", `<table class="w-full border-collapse text-sm"><tbody>
      ${ast.map(r => line(esc(r.name), r.balance)).join("")}
      ${line("<b>자산 합계</b>", astT, "bg-gray-50")}
      ${lia.map(r => line(esc(r.name), -r.balance)).join("")}
      ${line("<b>부채 합계</b>", liaT, "bg-gray-50")}
      ${line("<b>자본 합계(당기순이익 포함)</b>", eqtT, "bg-gray-50")}
      <tr class="bg-indigo-50 font-bold"><td class="p-2">부채와 자본 합계</td><td class="p-2 text-right">${won(liaT + eqtT)}</td></tr>
    </tbody></table>`)}
  </div>`);
}

function setB(i, k, v) { bomLines[i][k] = k === "qty_per" ? Number(v) || 0 : v; renderBLines(); }
function addBLine() { bomLines.push({ material_item_id: "", qty_per: 1 }); renderBLines(); }
function rmB(i) { bomLines.splice(i, 1); if (!bomLines.length) bomLines = [{ material_item_id: "", qty_per: 1 }]; renderBLines(); }
async function saveBom() {
  const pid = val("b_product");
  const lines = bomLines.filter(l => l.material_item_id && l.qty_per > 0);

  let bomId = ex?.id;
  if (bomId) { await sb.from("bom_lines").delete().eq("bom_id", bomId); }
  else {
    const { data: created, error } = await sb.from("boms").insert({ company_id: state.companyId, product_item_id: pid }).select("id").single();
    if (error) return toast(error.message, true);
    bomId = created.id;
  }
  const { error } = await sb.from("bom_lines").insert(lines.map(l => ({ company_id: state.companyId, bom_id: bomId, ...l })));
  if (error) return toast(error.message, true);
  bomLines = [{ material_item_id: "", qty_per: 1 }];
  toast("BOM이 저장되었습니다"); route();
}

async function saveWorkOrder() {
  if (!val("w_item")) return toast("제품을 선택하세요", true);
  if (num("w_qty") <= 0) return toast("지시수량을 입력하세요", true);
  const { data: no, error: e1 } = await sb.rpc("next_doc_no", { p_cid: state.companyId, p_type: "work_order", p_prefix: "WO" });
  if (e1) return toast(e1.message, true);
  const { error } = await sb.from("work_orders").insert({ company_id: state.companyId, doc_no: no,
    item_id: val("w_item"), order_qty: num("w_qty"), warehouse_id: val("w_wh"),
    due_date: val("w_due") || null, memo: val("w_memo").trim() || null });
  if (error) return toast(error.message, true);
  toast(`작업지시가 생성되었습니다 (${no})`); route();
}
async function completeWo(id, defQty) {
  const q = prompt("완료 수량을 입력하세요", defQty);
  if (q === null) return;
  const qty = Number(q);
  if (!(qty > 0)) return toast("수량이 올바르지 않습니다", true);
  const { error } = await sb.rpc("complete_work_order", { p_wo: id, p_qty: qty });
  if (error) return toast(error.message, true);
  toast("완료 처리되었습니다"); route();
}

async function vMrp() {
  const q = qs(), itemId = q.get("item") || "", qty = Number(q.get("qty") || 0);
  const { data: boms } = await sb.from("boms").select("product_item_id, items!boms_product_item_id_fkey(item_code,name)");
  let rows = [];
  if (itemId && qty > 0) {
    const [reqs, items, stock] = await Promise.all([
      sb.rpc("bom_requirements", { p_item: itemId, p_qty: qty }),
      sb.from("items").select("id,item_code,name,unit"),
      sb.from("current_stock").select("item_id,qty"),
    ]);
    if (reqs.error) throw reqs.error;
    const im = new Map((items.data || []).map(i => [i.id, i]));
    const tot = new Map(); (stock.data || []).forEach(s => tot.set(s.item_id, (tot.get(s.item_id) || 0) + Number(s.qty)));
    rows = (reqs.data || []).map(r => {
      const it = im.get(r.material_item_id), req = Number(r.total_qty), have = tot.get(r.material_item_id) || 0;
      return [it ? `[${esc(it.item_code)}] ${esc(it.name)}` : "?", won(req), won(have),
        req - have > 0 ? `<span class="font-semibold text-red-600">${won(req - have)}</span>` : `<span class="text-green-700">충분</span>`, esc(it?.unit || "")];
    });
  }
  h(card("소요량 조회 (MRP)", `<p class="mb-3 text-xs text-gray-500">다단계 BOM을 전개해 최종 자재 소요량을 계산하고 현재고와 비교합니다.</p>
    <div class="mb-4 flex flex-wrap items-end gap-2">
      ${sel("m_item", "제품", [["", "선택"], ...(boms || []).map(b => [b.product_item_id, `[${esc(b.items?.item_code)}] ${esc(b.items?.name)}`])], "w-56", itemId)}
      ${fld("m_qty", "생산 수량", "w-28", "number", qty || "")}
      ${btn("goto('mrp',{item:val('m_item'),qty:val('m_qty')})", "계산")}</div>` +
    (rows.length ? tbl(["자재", "소요량", "현재고", "부족분", "단위"], rows, [1, 2, 3]) : empty("제품과 수량을 입력하고 계산하세요."))));
}

async function vPayrollDetail() {
  const id = qs().get("id");
  if (!id) { location.hash = "#/payroll"; return; }
  const { data: run, error } = await sb.from("payroll_runs")
    .select("id,pay_year,pay_month,status,payroll_lines(id,gross,deductions,deduction_total,net,employees(emp_no,name,position))")
    .eq("id", id).maybeSingle();
  if (error) throw error;
  if (!run) { toast("급여대장을 찾을 수 없습니다", true); location.hash = "#/payroll"; return; }
  const lines = [...(run.payroll_lines || [])].sort((a, b) => (a.employees?.emp_no || "").localeCompare(b.employees?.emp_no || ""));
  const dedKeys = lines.length ? Object.keys(lines[0].deductions || {}) : [];
  window._payrun = { run, lines };
  const sum = (k) => lines.reduce((s, l) => s + Number(k === "gross" ? l.gross : k === "net" ? l.net : k === "ded" ? l.deduction_total : (l.deductions?.[k] || 0)), 0);
  h(`<div class="flex items-center justify-between">
      <a href="#/payroll" class="text-sm text-gray-500 hover:underline">← 급여 목록</a>
      <span class="rounded px-2 py-0.5 text-xs ${run.status === "confirmed" ? "bg-green-50 text-green-700" : "bg-gray-100 text-gray-600"}">${run.status === "confirmed" ? "확정" : "임시"}</span></div>
  ${card(`${run.pay_year}년 ${run.pay_month}월 급여대장 (${lines.length}명)`, lines.length ? tbl(
    ["사번", "이름", "직위", "기본급", ...dedKeys, "공제계", "실지급액", "명세서"],
    [...lines.map((l, i) => [esc(l.employees?.emp_no), esc(l.employees?.name), esc(l.employees?.position || ""), won(l.gross),
      ...dedKeys.map(k => won(l.deductions?.[k] || 0)), won(l.deduction_total), `<span class="font-semibold">${won(l.net)}</span>`,
      `<button onclick="printSlip(${i})" class="text-indigo-600 hover:underline">인쇄</button>`]),
     [`<b>합계</b>`, "", "", `<b>${won(sum("gross"))}</b>`, ...dedKeys.map(k => `<b>${won(sum(k))}</b>`), `<b>${won(sum("ded"))}</b>`, `<b>${won(sum("net"))}</b>`, ""]],
    [3, ...dedKeys.map((_, i) => 4 + i), 4 + dedKeys.length, 5 + dedKeys.length]) : empty("급여 라인이 없습니다."))}`);
}

  $("printView").innerHTML = `
    <h1>급 여 명 세 서</h1>
    <table class="meta" style="margin-bottom:10px"><tr>
      <td><b>귀속</b> ${run.pay_year}년 ${run.pay_month}월</td>
      <td style="text-align:right"><b>지급처</b> ${esc(state.companyName)}</td></tr></table>
    <table style="margin-bottom:12px"><tr>
      <th style="width:16%">사번</th><td style="width:34%">${esc(l.employees?.emp_no || "")}</td>
      <th style="width:16%">성명</th><td style="width:34%">${esc(l.employees?.name || "")}</td></tr>
      <tr><th>직위</th><td>${esc(l.employees?.position || "")}</td><th>지급일</th><td></td></tr></table>
    <table style="margin-bottom:12px"><thead><tr><th style="width:50%">지급 항목</th><th class="r">금액</th></tr></thead>
      <tbody><tr><td>기본급</td><td class="r">${won2(l.gross)}</td></tr></tbody>
      <tfoot><tr><th class="r">지급 합계</th><th class="r">${won2(l.gross)}</th></tr></tfoot></table>
    <table style="margin-bottom:12px"><thead><tr><th style="width:50%">공제 항목</th><th class="r">금액</th></tr></thead>
      <tbody>${ded.map(([k, v]) => `<tr><td>${esc(k)}</td><td class="r">${won2(v)}</td></tr>`).join("")}</tbody>
      <tfoot><tr><th class="r">공제 합계</th><th class="r">${won2(l.deduction_total)}</th></tr></tfoot></table>
    <table><tr><th style="width:50%" class="r">실 지급액</th><th class="r" style="font-size:16px">${won2(l.net)} 원</th></tr></table>
    <p style="margin-top:24px;text-align:right">${esc(state.companyName)}&nbsp;&nbsp;&nbsp;&nbsp;(인)</p>`;
  setTimeout(() => window.print(), 50);
}

async function vApprovals() {

    sb.from("approvals").select("id,title,content,requester,doc_type,doc_id,status,current_seq,created_at,approval_steps(seq,approver,status)").order("created_at", { ascending: false }).limit(100),

  if (aps.error) throw aps.error;
  const mem = (members.data || []).map(m => ({ id: m.user_id, email: m.email }));
  const emailOf = new Map(mem.map(m => [m.id, m.email]));
  const docs = [...(ds.data || []).map(d => [`sale:${d.id}`, `판매 ${d.doc_no}`]), ...(dp.data || []).map(d => [`purchase:${d.id}`, `구매 ${d.doc_no}`])];
  window._members = mem;
  h(`${card("결재 상신", `<div class="flex flex-wrap items-end gap-2">
      ${fld("ap_title", "제목", "w-64")}
      ${sel("ap_doc", "연동 전표(선택)", [["", "없음"], ...docs], "w-48")}
      ${fld("ap_content", "내용", "w-72")}</div>
    <div class="mt-3">
      <label class="mb-1 block text-xs text-gray-500">결재선 (순서대로 선택, Ctrl/Cmd로 다중 선택)</label>
      <select id="ap_approvers" multiple size="${Math.min(5, Math.max(3, mem.length))}" class="inp w-72">
        ${mem.map(m => `<option value="${m.id}">${esc(m.email)}</option>`).join("")}</select>
      <div class="mt-3">${btn("requestApproval()", "상신")}</div>
    </div>`)}
  ${card(`결재 문서 (${(aps.data || []).length})`, (aps.data || []).length ? `<div class="space-y-3">${aps.data.map(a => {
      const steps = [...(a.approval_steps || [])].sort((x, y) => x.seq - y.seq);
      const mine = steps.some(s => s.seq === a.current_seq && s.approver === state.user.id && s.status === "pending") && a.status === "pending";
      return `<div class="rounded-lg border p-3">
        <div class="mb-1 flex flex-wrap items-center justify-between gap-2">
          <p class="font-semibold">${esc(a.title)}</p>
          <span class="rounded px-2 py-0.5 text-xs ${AP_STYLE[a.status] || ""}">${AP_LABEL[a.status] || a.status}</span></div>
        <p class="mb-2 text-xs text-gray-500">기안 ${esc(emailOf.get(a.requester) || "?")} · ${String(a.created_at).slice(0, 10)}${a.doc_type ? ` · 연동 ${a.doc_type === "sale" ? "판매" : "구매"} 전표` : ""}</p>
        ${a.content ? `<p class="mb-2 text-sm text-gray-700">${esc(a.content)}</p>` : ""}
        <ol class="mb-2 flex flex-wrap gap-2 text-xs">${steps.map(s => `
          <li class="rounded border px-2 py-1 ${s.status === "approved" ? "border-green-300 bg-green-50 text-green-700" : s.status === "rejected" ? "border-red-300 bg-red-50 text-red-600" : s.seq === a.current_seq ? "border-amber-300 bg-amber-50 text-amber-700" : "text-gray-500"}">
          ${s.seq}. ${esc(emailOf.get(s.approver) || "?")}</li>`).join("")}</ol>
        ${mine ? `<div class="flex gap-2">
          <button onclick="decide('${a.id}','approved')" class="rounded bg-green-600 px-3 py-1.5 text-xs font-medium text-white hover:bg-green-700">승인</button>
          <button onclick="decide('${a.id}','rejected')" class="rounded bg-red-600 px-3 py-1.5 text-xs font-medium text-white hover:bg-red-700">반려</button></div>` : ""}
      </div>`;
    }).join("")}</div>` : empty("결재 문서가 없습니다."))}`);
}
async function requestApproval() {
  const title = val("ap_title").trim();
  const approvers = [...$("ap_approvers").selectedOptions].map(o => o.value);
  if (!title) return toast("제목을 입력하세요", true);
  if (!approvers.length) return toast("결재자를 1명 이상 선택하세요", true);
  const doc = val("ap_doc");
  const [dt, di] = doc ? doc.split(":") : [null, null];
  const { error } = await sb.rpc("request_approval", { p_title: title, p_content: val("ap_content").trim() || null,
    p_approvers: approvers, p_doc_type: dt, p_doc_id: di });
  if (error) return toast(error.message, true);
  toast("상신되었습니다"); route();
}
async function decide(id, decision) {
  if (!confirm(decision === "approved" ? "승인하시겠습니까? 최종 승인 시 연동 전표가 확정됩니다." : "반려하시겠습니까?")) return;
  const { error } = await sb.rpc("decide_approval", { p_approval: id, p_decision: decision });
  if (error) return toast(error.message, true);
  toast("처리되었습니다"); route();
}

async function vBoard() {
  const { data, error } = await sb.from("posts").select("id,title,content,author,created_at").order("created_at", { ascending: false }).limit(100);
  if (error) throw error;
  h(`${card("글쓰기", `<div class="flex flex-wrap items-end gap-2">
    ${fld("bd_title", "제목", "w-72")}${fld("bd_content", "내용", "w-96")}${btn("savePost()", "등록")}</div>`)}
  ${card(`게시글 (${(data || []).length})`, (data || []).length ? `<ul class="divide-y">${data.map(p => `
    <li class="py-3"><div class="flex items-start justify-between gap-2">
      <div class="min-w-0"><p class="font-semibold">${esc(p.title)}</p>
      ${p.content ? `<p class="mt-1 text-sm text-gray-600">${esc(p.content)}</p>` : ""}
      <p class="mt-1 text-xs text-gray-400">${String(p.created_at).slice(0, 16).replace("T", " ")}</p></div>
      ${p.author === state.user.id ? `<button onclick="delRow('posts','${p.id}')" class="shrink-0 text-xs text-red-600 hover:underline">삭제</button>` : ""}
    </div></li>`).join("")}</ul>` : empty("게시글이 없습니다."))}`);
}
async function savePost() {
  const title = val("bd_title").trim();
  if (!title) return toast("제목을 입력하세요", true);
  const { error } = await sb.from("posts").insert({ company_id: state.companyId, title, content: val("bd_content").trim() || null });
  if (error) return toast(error.message, true);
  toast("등록되었습니다"); route();
}

async function vCalendar() {
  const month = qs().get("month") || today().slice(0, 7);
  const [y, m] = month.split("-").map(Number);
  const from = `${month}-01`, to = new Date(y, m, 0).toISOString().slice(0, 10);
  const { data, error } = await sb.from("events").select("id,title,event_date,start_time,memo,created_by")
    .gte("event_date", from).lte("event_date", to).order("event_date").order("start_time");
  if (error) throw error;
  const byDate = new Map();
  (data || []).forEach(e => { if (!byDate.has(e.event_date)) byDate.set(e.event_date, []); byDate.get(e.event_date).push(e); });
  h(`${card("일정 등록", `<div class="flex flex-wrap items-end gap-2">
    ${fld("ev_title", "제목", "w-56")}${fld("ev_date", "일자", "w-36", "date", today())}${fld("ev_time", "시각", "w-28", "time")}${fld("ev_memo", "메모", "w-56")}
    ${btn("saveEvent()", "등록")}</div>`)}
  ${card(`${y}년 ${m}월 일정 (${(data || []).length})`, `<div class="mb-4 flex items-end gap-2">
      ${fld("cal_month", "조회 월", "w-36", "month", month)}${btn("goto('calendar',{month:val('cal_month')})", "조회")}</div>` +
    (byDate.size ? `<div class="space-y-3">${[...byDate.entries()].map(([d, evs]) => `
      <div><p class="mb-1 text-xs font-bold text-gray-500">${d}</p>
      <ul class="space-y-1">${evs.map(e => `<li class="flex items-center justify-between rounded border px-3 py-2 text-sm">
        <span class="min-w-0"><b>${e.start_time ? e.start_time.slice(0, 5) + " " : ""}</b>${esc(e.title)}
        ${e.memo ? `<span class="ml-2 text-xs text-gray-400">${esc(e.memo)}</span>` : ""}</span>
        ${e.created_by === state.user.id ? `<button onclick="delRow('events','${e.id}')" class="shrink-0 text-xs text-red-600 hover:underline">삭제</button>` : ""}
      </li>`).join("")}</ul></div>`).join("")}</div>` : empty("이 달에 등록된 일정이 없습니다.")))}`);
}
async function saveEvent() {
  const title = val("ev_title").trim();
  if (!title) return toast("제목을 입력하세요", true);
  const { error } = await sb.from("events").insert({ company_id: state.companyId, title,
    event_date: val("ev_date"), start_time: val("ev_time") || null, memo: val("ev_memo").trim() || null });
  if (error) return toast(error.message, true);
  toast("등록되었습니다"); route();
}

/* ===== 시작 ===== */
sb.auth.onAuthStateChange((e) => { if (e === "SIGNED_OUT") show("loginView"); });
boot();
</script>
</body>
</html>
